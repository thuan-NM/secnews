name: secnews

on:
  schedule:
    # shortcut: 30 phút vì repo private chỉ có 2.000 phút/tháng; repo public thì đổi thành */15
    - cron: "*/30 * * * *" # run
    - cron: "30 1 * * *"   # digest 08:30 giờ VN (01:30 UTC)
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [run, digest]
        default: run

# hai lần chạy không được chồng nhau vì cùng ghi một secnews.db
concurrency:
  group: secnews
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  secnews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lấy secnews.db từ nhánh data
        uses: actions/checkout@v4
        with:
          ref: data
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Chạy secnews
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          CMD: ${{ github.event.schedule == '30 1 * * *' && 'digest' || inputs.command || 'run' }}
        run: |
          printf '%s\n' "$CONFIG_YAML" > config.yaml
          mkdir -p data
          cp state/secnews.db data/secnews.db
          python -m secnews "$CMD"

      # lưu cả khi bước trên lỗi, để tin đã gửi không bị gửi lại
      - name: Lưu secnews.db về nhánh data
        if: always()
        run: |
          [ -f data/secnews.db ] || exit 0
          cp data/secnews.db state/secnews.db
          cd state
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add secnews.db
          git diff --cached --quiet && exit 0
          # amend + force push để nhánh data chỉ có 1 commit, không phình lịch sử
          git commit --amend -m "secnews.db"
          git push -f origin HEAD:data
